<html>
<head>
	<meta charset="UTF-8">
	<title>GOcean Contact Manager</title>
	<link href="css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
	<script src="js/code.js" defer></script>
</head>
<body>

<h1 id="title">GOcean Contact Manager</h1>


<div id="loggedInDiv">
	Logged in as: <span id="userName"></span><br>
	<button type="button" class="buttons" onclick="doLogout();">Log Out</button>
</div>
<hr>


<div id="searchDiv">
	<input type="text" id="searchText" placeholder="Search for contact"/>
	<button type="button" class="buttons" onclick="searchContacts();">Search</button>
</div>
<br>
<div id="contactResults"></div>
<hr>


<div id="addDiv">
	<input type="text" id="firstName" placeholder="First Name">
	<input type="text" id="lastName" placeholder="Last Name">
	<input type="text" id="email" placeholder="Email">
	<input type="text" id="phone" placeholder="Phone">
	<button type="button" class="buttons" onclick="addContact();">Add Contact</button>
</div>

<br>


<div id="statusMessages">
	<span id="contactAddResult"></span>
	<span id="contactEditResult"></span>
	<span id="contactDeleteResult"></span>
</div>

</body>
</html>
