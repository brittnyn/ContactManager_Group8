<!DOCTYPE html>
	<html lang="en">
	</html>
	<head>
		<meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link href="css/styles.css" rel="stylesheet">	
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<title>Login | Marmoris</title>
	</head>
	
	<body>
		<main>
			<div class="containerDiv" aria-label="Main Container">
				<div class="boxDiv" id="box">
					<div class="formViewpoint">
						<!-- Login Box -->
						<div class="loginBox">
							<div id="boxHeader">
								<h3>Contact Manager</h3>
								<small>Welcome Back!</small>
							</div>
							<div id="groupDiv">
								<div class="inputDiv">
									<input type="text" class="inputField" id="loginName" required/>
									<label for="loginName">Username</label>
								</div>
								<div class="inputDiv">
									<input type="password" class="inputField" id="loginPassword" autocomplete="off" required/>
									<label for="loginPassword">Password</label>
								</div>
								<div class="showPassword">
									<div id="eyeDiv">
										<div class="eyeBox" onclick="toggleLoginPassword();" aria-label="Show password" role="button">
											<i class ="fa-regular fa-eye" id="eye"></i>
											<i class ="fa-regular fa-eye-slash" id="eyeSlash"></i>
										</div>
									</div>
								</div>
								<div class="buttonDiv">
									<button type="button" id="loginButton" onclick="doLogin();"></button>
									<label for="loginButton">Log In</label>
									<span id="loginResult" class="errorMsg"></span>
								</div>
							</div>
						</div>
						<!-- Register Box-->
						<div class="registerBox">
							<div id="boxHeader">
								<h3>Sign Up</h3>
								<small>Thank you for joining!</small>
							</div>
							<div id="groupDiv">
								<div class="inputDiv">
									<input type="text" class="inputField" id="regFirst" autocomplete="off" required/>
									<label for="regFirstName">First Name</label>
								</div>
								<div class="inputDiv">
									<input type="text" class="inputField" id="regLast" autocomplete="off" required/>
									<label for="regLastName">Last Name</label>
								</div>
								<div class="inputDiv">
									<input type="text" class="inputField" id="regUser" autocomplete="off" required>
									<label for="regUser">Username</label>
								</div>
								<div class="inputDiv">
									<input type="password" class="inputField" id="regPassword" autocomplete="off" required>
									<label for="regPassword">Password</label>
								</div>
								<div class="showPassword">
									<div id="eyeDiv">
										<div class="eyeBox" onclick="toggleRegPassword();" aria-label="Show password" role="button">
											<i class ="fa-regular fa-eye" id="eye-2"></i>
											<i class ="fa-regular fa-eye-slash" id="eyeSlash-2"></i>
										</div>
									</div>
								</div>
								<div class="buttonDiv">
									<button type="button" id="registerButton" onclick="doRegister();"></button>
									<label for="registerButton">Register</label>
									<span id="registerResult" class="errorMsg"></span> 
								</div>
							</div>
						</div> 
					</div>
					<!--Switch between Login and Register Boxes -->
					<div id="switchBox" aria-label="Navigation">
						<a href="#" id="loginSwitch" onclick="switchToLogin()">Login</a>
						<a href="#" id="registerSwitch" onclick="switchToRegister()">Register</a>
						<div class="activateSwitch" id="switchButton"></div>
					</div>
				</div>
			</div>
		</main>
		<!-- JavaScript Files -->	
		<script type="text/javascript" src="js/md5.js"></script>
		<script type="text/javascript" src="js/code.js"></script>
	</body>
</html>
